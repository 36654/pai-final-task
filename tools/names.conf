# チェックポイントの現行の名前(seen_all.sh / smolvla_all.sh が読む)。新しく学習したら、ここを書き換える
ACT30K=s1_region_act30k_1021
ACT80K=s1_region_80k
SMOLVLA=s1_region_smolvla/final
DATA=s1_region
# ステージ2(積み木2個・言語指示)。S2DATA=デモ・データの名前(日付入りで新規。既にあれば stage2_gen は止まる)。S2_SMOLVLA=学習後のSmolVLA(データ名_smolvla/final)
S2DATA=s2_color_1024
# 1回目(同じ画面で対象が1通りだけのデータ)のモデル。指示を使っていなかった(記録のため残す)
S2_SMOLVLA_V1=s2_color_1024_smolvla/final
# ステージ2b(同じ画面で対象を入れ替えたデモを足したデータ)。S2PAIR=データ名(新規。既にあれば stage2_gen pair は止まる)
S2PAIR=s2_pair_1024
# 2回目(S2PAIRで学習)のモデル。条件Cが3/10で、記録のため残す
S2_SMOLVLA_PAIR=s2_pair_1024_smolvla/final
# ステージ2c(S2PAIR + ステージ1の単一ブロックのデモ DATA を混ぜたデータ)。stage2_gen mix で作る(新規。既にあれば止まる)
S2MIX=s2_mix_1025
# stage2_eval.bat が評価するSmolVLA(現行)=S2MIXで学習したモデル
S2_SMOLVLA=s2_mix_1025_smolvla/final
